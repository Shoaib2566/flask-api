name: Flask CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest test_app.py -v

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flask-api:${{ github.sha }} .

      - name: Run container and check health
        run: |
          docker run -d -p 5000:5000 --name test-container flask-api:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:5000/api/health
          docker stop test-container
          docker rm test-container

      - name: Use LAB_SECRET safely
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}
        run: |
          if [ -n "$LAB_SECRET" ]; then
            echo "Secret loaded successfully"
          else
            echo "Secret is missing"
            exit 1
          fi

  report:
    name: Report Pipeline Summary
    runs-on: ubuntu-latest
    needs: build-docker

    steps:
      - name: Print pipeline summary
        run: |
          echo "Pipeline complete for commit: ${{ github.sha }}"